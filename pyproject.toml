[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horizon-mcp"
version = "0.2.0"
description = "MCP Server for Omnissa Horizon REST API"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # 3.3+ for elicitation, get_context() and HTTP middleware; <4 until 4.x is tested.
    "fastmcp>=3.3.1,<4",
    "httpx>=0.27",
    "pydantic>=2.0",
    # Transitive-dependency security floors (see Dependabot alerts on the repo).
    "cryptography>=50.0.0",
    "mcp>=1.28.1",
    "pydantic-settings>=2.14.2",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "anyio>=4.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyright>=1.1",
]

[project.scripts]
horizon-mcp = "horizon_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/horizon_mcp"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: runs against a real Horizon server over MCP stdio; skipped unless HZ_* env vars are set (see README)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
